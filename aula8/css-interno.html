<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cafeteria Grão Dourado — CSS Interno</title>
  <!--
    FORMA 2: CSS INTERNO
    O estilo fica reunido na tag <style>, dentro do <head>.
      -->
  <style>
    header {
        background-color: #66472d;
    }
    header h1 {
        color: #ffffff;
        margin: 0;
        padding: 10px;
        font-family: comic Sans MS, sans-serif;
        text-align: center;
    }
    header p {
        color: #ffffff;
        margin: 0;
        padding: 10px;
        font-family: Arial, sans-serif;
        text-align: center;
    }
    body{
        background-color: #f5d8d8;
        margin: 0;
    }
    main {
        padding: 20px;
        width: 400px;
        margin: auto;
    }
    main h2 {
        text-align: center;
        font-family: Helvetica, sans-serif;
        color: #66472d;
    }
    section {
        background-color: #fdf4e6;
        border: 2px solid #d4a373;
        padding: 10px;
        margin-bottom: 10px;
        border-radius: 10px;
    }
    section h3 {
        margin: 0;
        font-family: Georgia,serif;
        color: #66472d;
    }
    section p {
        margin: 16px 0 0 0;
        font-family: Verdana, sans-serif;
        color: #66472d;
    }
    footer {
        background-color: #66472d;
        color: #ffffff;
        text-align: center;
        padding: 10px;
        font-family: 'Segoe UI', sans-serif;
    }
  </style>
</head>
<body>

  <header>
    <h1>☕ Cafeteria Grão Dourado</h1>
    <p>O melhor café de Suzano</p>
  </header>

  <main>
    <h2>Nosso cardápio</h2>

    <section>
      <h3>Espresso</h3>
      <p>Café curto e intenso. R$ 6,00</p>
    </section>

    <section>
      <h3>Cappuccino</h3>
      <p>Café, leite vaporizado e canela. R$ 9,50</p>
    </section>

    <section>
      <h3>Pão de queijo</h3>
      <p>Quentinho, saído do forno. R$ 5,00</p>
    </section>
  </main>

  <footer>
    Exemplo de aula — CSS Interno
  </footer>

</body>
</html>
